name = "url-shortener"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 自动开通 KV（automatic provisioning）：
# 省略 id，部署时（含 GitHub 原生集成）由 Cloudflare 自动创建命名空间，
# 以 worker 名（url-shortener）为前缀，无需手动创建或回填 id。
# 注：自动开通为 Beta，需较新的 compatibility_date（见上）。
[[kv_namespaces]]
binding = "LINKS"

# ADMIN_TOKEN 不要写在这里（公开仓库）。
# 生产（含 GitHub 原生集成部署）：在 Cloudflare 控制台将该 Worker 的
#   "Settings → Variables → ADMIN_TOKEN" 设为 secret 变量。
# 本地开发：在项目根目录创建 .dev.vars，内容：ADMIN_TOKEN=你的token
